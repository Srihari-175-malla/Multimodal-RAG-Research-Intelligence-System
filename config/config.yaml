vector_backend: "qdrant"        # "qdrant" | "faiss"
qdrant:
  host: "localhost"
  port: 6333
  collection: "research_papers"
faiss:
  index_path: "data/index/faiss.index"
  metadata_path: "data/index/faiss_meta.pkl"

embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  batch_size: 32
  normalize: true

chunking:
  max_tokens: 400
  overlap_tokens: 60
  min_tokens: 40

retrieval:
  dense_top_k: 25
  bm25_top_k: 25
  rrf_k: 60
  final_top_k: 8

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_k: 8

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  max_tokens: 1500
  temperature: 0.2

paths:
  raw_papers: "data/raw"
  processed: "data/processed"
